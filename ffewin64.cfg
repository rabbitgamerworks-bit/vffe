# JJFFE x64 / Vulkan configuration (Windows 64-bit)

[VIDEO]
# 1 = start in borderless fullscreen (Alt+Enter or Ctrl+F12 toggles)
fullscreen=0
# Initial window client size
winwidth=960
winheight=600
# 1 = wait for vertical blank (FIFO), 0 = mailbox/immediate if available
vsync=1
# 1 = bilinear filtering when scaling, 0 = sharp pixels
bilinear=0
# 1 = show the 320x200 image at 4:3 like a CRT, 0 = square pixels (16:10)
aspect43=0
# 1 = enable Vulkan validation layer if installed (debugging)
validation=0

# Brightness correction parameters
# -10 => somewhat darker
# 10 => somewhat brighter
RedBase=0
GreenBase=0
BlueBase=0

[DIR]
SamplePath=fx
SongPath=music
AVIPath=data
CmmdrPath=commandr

[SOUND]
nosound=0
nomusic=0

[MOUSE]
sensitivity=100

[KEYBOARD]
repeatdelay=300
repeatrate=30

[JOYSTICK]
enabled=0
xmax=512
ymax=512
xdeadzone=50
ydeadzone=50
